# Table geometry, pickup zone and rack slot layout, all in the arm base frame (metres).
table_height: 0.0
table_size: [0.8000, 0.8000]

# Tubes are spawned (sim) and expected (real) inside this axis-aligned box.
pickup_zone:
  x_min: 0.1300
  x_max: 0.2500
  y_min: -0.1350
  y_max: 0.1350

tube:
  body_radius: 0.0080
  body_height: 0.0400
  cap_radius: 0.0095
  cap_height: 0.0120
  min_separation: 0.0400       # keeps spawned tubes from overlapping
  mass: 0.0150
  # Printed QR label on the cap. Measured, not guessed: larger than ~9 mm and the
  # overhead colour detector starts losing caps (the coloured ring fragments);
  # smaller than ~7 mm and the wrist camera stops decoding reliably. 8.5 mm read
  # 24/24 on both cameras across three seeds.
  label_side: 0.0085

# Grasp/approach heights measured from the table surface.
grasp_height: 0.0460           # TCP height when closing on a tube cap
# A carried tube hangs `grasp_height` below the TCP, so the transit height must
# clear the tops of the tubes still standing on the table:
#   grasp_height + approach_clearance - grasp_height  >  tube.total_height
approach_clearance: 0.0700     # extra height for pre-grasp / lift / transit poses
rack_plate_height: 0.0080      # thickness of a rack plate; raises its grasp height

# Where a knocked-over tube is stood back up, then sorted from like any other.
# Chosen by search, not by eye: of 52 spots that are reachable, outside the pickup
# zone and clear of the wrist link's sweep (standing a tube holds the tool level,
# so the last link lies flat at tube height), only three still show an upright cap
# as round to the overhead camera; near the edge of the view perspective makes it
# look elongated, i.e. fallen. This one reads aspect 1.08 against the 1.25 cut.
righting_station: [0.2800, 0.1600]
righting_station_radius: 0.0300

racks:
  - id: rack_a
    label: "Rack A"
    slots:
      - [0.1000, 0.2000]
      - [0.1450, 0.2000]
      - [0.1900, 0.2000]
      - [0.2350, 0.2000]
  - id: rack_b
    label: "Rack B"
    slots:
      - [0.1000, -0.2000]
      - [0.1450, -0.2000]
      - [0.1900, -0.2000]
      - [0.2350, -0.2000]
  - id: rack_c
    label: "Rack C"
    slots:
      - [0.2950, 0.0750]
      - [0.2950, 0.0250]
      - [0.2950, -0.0250]
      - [0.2950, -0.0750]

# Printed ArUco board used for real-mode camera-to-table calibration.
marker_board:
  dictionary: DICT_4X4_50
  squares_x: 5
  squares_y: 4
  square_length: 0.0400        # metres
  marker_length: 0.0300
  # Table-frame XY of the board origin (its top-left square corner).
  origin: [0.0500, -0.1500]
