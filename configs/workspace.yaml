# Table geometry, pickup zone and rack slot layout, all in the arm base frame (metres).
table_height: 0.0
table_size: [0.8000, 0.8000]

# Tubes are spawned (sim) and expected (real) inside this axis-aligned box.
pickup_zone:
  x_min: 0.1300
  x_max: 0.2500
  y_min: -0.1350
  y_max: 0.1350

tube:
  body_radius: 0.0080
  body_height: 0.0400
  cap_radius: 0.0095
  cap_height: 0.0120
  min_separation: 0.0400       # keeps spawned tubes from overlapping
  mass: 0.0150

# Grasp/approach heights measured from the table surface.
grasp_height: 0.0460           # TCP height when closing on a tube cap
# A carried tube hangs `grasp_height` below the TCP, so the transit height must
# clear the tops of the tubes still standing on the table:
#   grasp_height + approach_clearance - grasp_height  >  tube.total_height
approach_clearance: 0.0700     # extra height for pre-grasp / lift / transit poses
rack_plate_height: 0.0080      # thickness of a rack plate; raises its grasp height

racks:
  - id: rack_a
    label: "Rack A"
    slots:
      - [0.1000, 0.2000]
      - [0.1450, 0.2000]
      - [0.1900, 0.2000]
      - [0.2350, 0.2000]
  - id: rack_b
    label: "Rack B"
    slots:
      - [0.1000, -0.2000]
      - [0.1450, -0.2000]
      - [0.1900, -0.2000]
      - [0.2350, -0.2000]
  - id: rack_c
    label: "Rack C"
    slots:
      - [0.2950, 0.0750]
      - [0.2950, 0.0250]
      - [0.2950, -0.0250]
      - [0.2950, -0.0750]

# Printed ArUco board used for real-mode camera-to-table calibration.
marker_board:
  dictionary: DICT_4X4_50
  squares_x: 5
  squares_y: 4
  square_length: 0.0400        # metres
  marker_length: 0.0300
  # Table-frame XY of the board origin (its top-left square corner).
  origin: [0.0500, -0.1500]
